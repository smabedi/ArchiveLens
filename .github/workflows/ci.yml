name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-pwsh:
    name: Test on Windows (PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester v5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
              Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0.0

      - name: Run ArchiveLens Pester Test Suite
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests/ArchiveLens.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Test CMD Wrapper Integration
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\ArchiveToText.cmd" -NoInteractive 2>nul
          if %ERRORLEVEL% NEQ 1 (
              echo Expected exit code 1 when called with -NoInteractive and no archive path, got %ERRORLEVEL%
              exit /b 1
          )
          echo CMD wrapper exit code propagation verified.
          exit /b 0

  test-powershell:
    name: Test on Windows (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester v5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
              Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0.0

      - name: Run ArchiveLens Pester Test Suite
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests/ArchiveLens.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Test CMD Wrapper Integration
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\ArchiveToText.cmd" -NoInteractive 2>nul
          if %ERRORLEVEL% NEQ 1 (
              echo Expected exit code 1 when called with -NoInteractive and no archive path, got %ERRORLEVEL%
              exit /b 1
          )
          echo CMD wrapper exit code propagation verified.
          exit /b 0

  release:
    name: Publish GitHub Release
    needs: [test-pwsh, test-powershell]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$version\].*?(?=(^## \[)|\Z)"
          if ($changelog -match $pattern) {
              Set-Content -Path release_notes.md -Value $matches[0].Trim()
          } else {
              Set-Content -Path release_notes.md -Value "ArchiveLens Release $version"
          }

      - name: Package Release Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ArchiveLens_Release"
          Copy-Item -Path "ArchiveLens.psd1", "ArchiveLens.psm1", "ArchiveToText.ps1", "ArchiveToText.cmd", "Install.ps1", "README.md", "LICENSE.txt", "CHANGELOG.md" -Destination "ArchiveLens_Release"
          Compress-Archive -Path "ArchiveLens_Release\*" -DestinationPath "ArchiveLens-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArchiveLens-${{ github.ref_name }}.zip
          body_path: release_notes.md